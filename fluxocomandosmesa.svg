<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1400" height="950" viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">

<style>
  .box { fill:#1e1e1e; stroke:#00d4ff; stroke-width:2; rx:10; }
  .title { fill:#ffffff; font-size:20px; font-family:monospace; }
  .subtitle { fill:#00d4ff; font-size:16px; font-family:monospace; }
  .text { fill:#cfcfcf; font-size:13px; font-family:monospace; }
</style>

<!-- TITLE -->
<text x="350" y="40" class="title">
RotTableWrapper — Command Flow (Modbus Map)
</text>

<!-- COLUMN TITLES -->
<text x="120" y="80" class="subtitle">YAW</text>
<text x="620" y="80" class="subtitle">COMMON</text>
<text x="1120" y="80" class="subtitle">ROLL</text>

<!-- ===================== -->
<!-- ROW 1 - PREPARE -->
<!-- ===================== -->

<!-- PREPARE YAW -->
<rect x="50" y="100" width="350" height="200" class="box"></rect>
<text x="70" y="130" class="text">PREPARE YAW</text>
<text x="70" y="160" class="text">write(40, acc)</text>
<text x="70" y="180" class="text">write(42, acc)</text>
<text x="70" y="210" class="text">write(22,1)</text>
<text x="70" y="230" class="text">delay 0.1s</text>
<text x="70" y="260" class="text">write(24,1)</text>
<text x="70" y="280" class="text">delay 0.1s</text>

<!-- COMMON EMPTY (ALIGNMENT) -->
<rect x="525" y="100" width="350" height="200" class="box"></rect>
<text x="545" y="180" class="text">prepare_all_motion()</text>

<!-- PREPARE ROLL -->
<rect x="1000" y="100" width="350" height="200" class="box"></rect>
<text x="1020" y="130" class="text">PREPARE ROLL</text>
<text x="1020" y="160" class="text">write(50, acc)</text>
<text x="1020" y="180" class="text">write(52, acc)</text>
<text x="1020" y="210" class="text">write(22,1)</text>
<text x="1020" y="230" class="text">delay 0.1s</text>
<text x="1020" y="260" class="text">write(24,1)</text>
<text x="1020" y="280" class="text">delay 0.1s</text>

<!-- ===================== -->
<!-- ROW 2 - MOVE -->
<!-- ===================== -->

<!-- MOVE YAW -->
<rect x="50" y="340" width="350" height="220" class="box"></rect>
<text x="70" y="370" class="text">MOVE YAW</text>
<text x="70" y="400" class="text">write(24,2)</text>
<text x="70" y="420" class="text">write(28,0)</text>
<text x="70" y="450" class="text">write_dword(70,pos)</text>
<text x="70" y="480" class="text">delay 0.02s</text>
<text x="70" y="510" class="text">write(28,4)</text>

<!-- COMMON -->
<rect x="525" y="340" width="350" height="220" class="box"></rect>
<text x="545" y="370" class="text">MOVE ALL</text>
<text x="545" y="400" class="text">write(24,2) + write(22,2)</text>
<text x="545" y="420" class="text">write(28,0) + write(26,0)</text>
<text x="545" y="450" class="text">write_dword(70,pos)</text>
<text x="545" y="470" class="text">write_dword(60,pos)</text>
<text x="545" y="500" class="text">delay 0.02s</text>
<text x="545" y="530" class="text">write(28,4) + write(26,4)</text>

<!-- MOVE ROLL -->
<rect x="1000" y="340" width="350" height="220" class="box"></rect>
<text x="1020" y="370" class="text">MOVE ROLL</text>
<text x="1020" y="400" class="text">write(22,2)</text>
<text x="1020" y="420" class="text">write(26,0)</text>
<text x="1020" y="450" class="text">write_dword(60,pos)</text>
<text x="1020" y="480" class="text">delay 0.02s</text>
<text x="1020" y="510" class="text">write(26,4)</text>

<!-- ===================== -->
<!-- ROW 3 - JOG -->
<!-- ===================== -->

<!-- JOG YAW -->
<rect x="50" y="600" width="350" height="200" class="box"></rect>
<text x="70" y="630" class="text">JOG YAW</text>
<text x="70" y="660" class="text">write_dword(56,|vel|)</text>
<text x="70" y="690" class="text">dir: 28</text>
<text x="70" y="710" class="text">1=+ 2=- 0=stop</text>

<!-- COMMON -->
<rect x="525" y="600" width="350" height="200" class="box"></rect>
<text x="545" y="630" class="text">FEEDBACK</text>
<text x="545" y="660" class="text">Yaw: read(0,2)</text>
<text x="545" y="680" class="text">Roll: read(4,2)</text>
<text x="545" y="710" class="text">Vel Yaw: read(2,2)</text>
<text x="545" y="730" class="text">Vel Roll: read(6,2)</text>
<text x="545" y="760" class="text">→ /1_000_000</text>

<!-- JOG ROLL -->
<rect x="1000" y="600" width="350" height="200" class="box"></rect>
<text x="1020" y="630" class="text">JOG ROLL</text>
<text x="1020" y="660" class="text">write_dword(46,|vel|)</text>
<text x="1020" y="690" class="text">dir: 26</text>
<text x="1020" y="710" class="text">1=+ 2=- 0=stop</text>

<!-- ===================== -->
<!-- ROW 4 - EMERGENCY -->
<!-- ===================== -->

<rect x="525" y="830" width="350" height="100" class="box"></rect>
<text x="545" y="860" class="text">EMERGENCY</text>
<text x="545" y="885" class="text">write(20,4) → stop</text>
<text x="545" y="905" class="text">delay → write(20,0)</text>

</svg>